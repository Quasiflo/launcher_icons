name: example_with_flavors
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  launcher_icons:
    path: ../..

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  default-flavor: development

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Icon sources for launcher_icons. Every file below is referenced by
  # launcher_icons-development.yaml / launcher_icons-production.yaml.
  assets:
    - assets/icon/icon-dev.svg
    - assets/icon/icon-dev-dark.svg
    - assets/icon/icon-dev-tinted.svg
    - assets/icon/icon-dev-foreground.svg
    - assets/icon/icon-dev-monochrome.svg
    - assets/icon/icon-dev-round.svg
    - assets/icon/icon-dev-maskable.svg
    - assets/icon/icon-dev-favicon.svg
    - assets/icon/icon-prod.svg
    - assets/icon/icon-prod-dark.svg
    - assets/icon/icon-prod-tinted.svg
    - assets/icon/icon-prod-foreground.svg
    - assets/icon/icon-prod-monochrome.svg
    - assets/icon/icon-prod-background.svg
    - assets/icon/icon-prod-round.svg
    - assets/icon/icon-prod-maskable.svg
    - assets/icon/icon-prod-favicon.svg
    - assets/icon/icon-prod-glass.svg
    - assets/icon/icon-prod-glass-dark.svg
    - assets/icon/icon-prod-glass-tinted.svg

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flavor icon configs: `dart run launcher_icons` runs every
# launcher_icons-<flavor> section; --flavor runs one.
# Development flavor — the transparency showcase.
#
# Run: dart run launcher_icons -f launcher_icons-development.yaml
# (discovers the "-development" flavor from the file name automatically)
#
# Every key is filled. `icon_name` is intentionally absent: under flavors the
# catalog is always `AppIcon-<flavor>` (iOS/macOS) / `src/<flavor>/res`
# (Android), so a custom name would be ignored.
launcher_icons-development:
    image_path: "assets/icon/icon-dev.svg"

    android:
      generate: true
      image_path: "assets/icon/icon-dev.svg"
      adaptive_icon_background: "transparent" # keyword: no colors.xml entry
      adaptive_icon_foreground: "assets/icon/icon-dev-foreground.svg"
      adaptive_icon_foreground_inset: 16
      adaptive_icon_monochrome: "assets/icon/icon-dev-monochrome.svg"
      adaptive_icon_round: "assets/icon/icon-dev-round.svg"
      play_store_icon: true

    ios:
      generate: true
      single_size: false
      image_path: "assets/icon/icon-dev.svg"
      xcodeproj_path: "ios/Runner.xcodeproj"
      flavor_mode: "pbxproj" # rewrites ASSETCATALOG_COMPILER_APPICON_NAME
      remove_alpha: true # matte below blended onto background_color
      background_color: "#123456"
      image_path_dark_transparent: "assets/icon/icon-dev-dark.svg"
      image_path_tinted_grayscale: "assets/icon/icon-dev-tinted.svg"
      desaturate_tinted_to_grayscale: true
      liquid_glass_layers:
        - image_path: "assets/icon/icon-dev.svg"
      remove_liquid_glass: false
      liquid_glass_translucency: 0.5
      liquid_glass_specular: true
      liquid_glass_shadow_kind: "Chromatic"
      liquid_glass_shadow_opacity: 0.5
      liquid_glass_blur: 0.5

    web:
      generate: true
      image_path: "assets/icon/icon-dev.svg"
      image_path_favicon: "assets/icon/icon-dev-favicon.svg"
      image_path_maskable: "assets/icon/icon-dev-maskable.svg"
      favicon_size: 16
      favicon_ico: true
      output_path: "web_development"
      background_color: "#123456"
      theme_color: "#123456"

    windows:
      generate: true
      image_path: "assets/icon/icon-dev.svg"
      icon_filename: "app_icon_development.ico"

    macos:
      generate: true
      image_path: "assets/icon/icon-dev.svg"
      padding: 10
      rounded_corners: true

    linux:
      generate: true
      image_path: "assets/icon/icon-dev.svg"

# Production flavor — the opaque full-bleed + liquid-glass showcase.
#
# Run: dart run launcher_icons -f launcher_icons-production.yaml
# (discovers the "-production" flavor from the file name automatically)
#
# Every key is filled. `icon_name` is intentionally absent: under flavors the
# catalog is always `AppIcon-<flavor>` (iOS/macOS) / `src/<flavor>/res`
# (Android), so a custom name would be ignored.
launcher_icons-production:
    image_path: "assets/icon/icon-prod.svg"

    android:
      generate: true
      image_path: "assets/icon/icon-prod.svg"
      adaptive_icon_background: "assets/icon/icon-prod-background.svg"
      adaptive_icon_foreground: "assets/icon/icon-prod-foreground.svg"
      adaptive_icon_foreground_inset: 10
      adaptive_icon_monochrome: "assets/icon/icon-prod-monochrome.svg"
      adaptive_icon_round: "assets/icon/icon-prod-round.svg"
      play_store_icon: false

    ios:
      generate: true
      single_size: false
      image_path: "assets/icon/icon-prod.svg"
      xcodeproj_path: "ios/Runner.xcodeproj"
      flavor_mode: "xcconfig" # writes ios/Flutter/<flavor>-<Mode>.xcconfig
      remove_alpha: false # art is already opaque; nothing to blend
      background_color: "#ffffff"
      image_path_dark_transparent: "assets/icon/icon-prod-dark.svg"
      image_path_tinted_grayscale: "assets/icon/icon-prod-tinted.svg"
      desaturate_tinted_to_grayscale: false
      liquid_glass_layers:
        - image_path: "assets/icon/icon-prod-glass.svg"
          image_path_dark: "assets/icon/icon-prod-glass-dark.svg"
          image_path_tinted: "assets/icon/icon-prod-glass-tinted.svg"
          scale: 0.9
          offset_y: 4.0
        - image_path: "assets/icon/icon-prod-foreground.svg"
          scale: 0.7
          glass: true
          blend_mode: "normal"
      remove_liquid_glass: false
      liquid_glass_translucency: 0.7
      liquid_glass_specular: true
      liquid_glass_shadow_kind: "Neutral"
      liquid_glass_shadow_opacity: 0.3
      liquid_glass_blur: 0.8
      liquid_glass_lighting: "individual"
      liquid_glass_refractivity_enabled: true
      liquid_glass_refractivity_depth: 0.5
      liquid_glass_refractivity_strength: 0.5
      liquid_glass_specular_highlight_placement: "outside"

    web:
      generate: true
      image_path: "assets/icon/icon-prod.svg"
      image_path_favicon: "assets/icon/icon-prod-favicon.svg"
      # no image_path_maskable: derives a padded fallback from the logo (warns)
      favicon_size: 32
      favicon_ico: false # ship the PNG only
      output_path: "web_production"
      background_color: "#283593"
      theme_color: "#283593"

    windows:
      generate: true
      image_path: "assets/icon/icon-prod.svg"
      icon_filename: "app_icon.ico"

    macos:
      generate: true
      image_path: "assets/icon/icon-prod.svg"
      padding: 0
      rounded_corners: false
      liquid_glass_layers:
        - image_path: "assets/icon/icon-prod-glass.svg"
          image_path_dark: "assets/icon/icon-prod-glass-dark.svg"
          image_path_tinted: "assets/icon/icon-prod-glass-tinted.svg"
          scale: 0.9
          offset_y: 4.0
        - image_path: "assets/icon/icon-prod-foreground.svg"
          scale: 0.7
          glass: true
          blend_mode: "normal"
      remove_liquid_glass: false
      background_color: "#ffffff"
      liquid_glass_translucency: 0.7
      liquid_glass_specular: true
      liquid_glass_shadow_kind: "Neutral"
      liquid_glass_shadow_opacity: 0.3
      liquid_glass_blur: 0.8
      liquid_glass_lighting: "individual"
      liquid_glass_refractivity_enabled: true
      liquid_glass_refractivity_depth: 0.5
      liquid_glass_refractivity_strength: 0.5
      liquid_glass_specular_highlight_placement: "outside"

    linux:
      generate: true
      image_path: "assets/icon/icon-prod.svg"
