name: example
description: A new Flutter project to quickly test launcher_icons.

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.3
  launcher_icons:
    path: ../..

launcher_icons:
  android:
    generate: true # can specify icon_name here e.g. "ic_launcher"
    image_path: "assets/images/icon-android-710x599.png"
    adaptive_icon_background: "assets/images/bg-christmas-620x420.png" # only available for Android 8.0 devices and above
    adaptive_icon_foreground: "assets/images/icon-foreground-432.png" # only available for Android 8.0 devices and above
    adaptive_icon_foreground_inset: 16 # only available for Android 8.0 devices and above
    adaptive_icon_monochrome: "assets/images/icon-monochrome-432.png" # only available for Android 13 devices and above
  ios:
    generate: true # can specify icon_name here e.g. "My-Launcher-Icon"
    image_path: "assets/images/icon-ios-710x599.png"
    remove_alpha: true
    background_color: "#ffffff"
    # Liquid Glass .icon configuration for iOS
    liquid_glass_layers:
      - image_path: "assets/images/icon-master-1024.png"
        scale: 0.85
    liquid_glass_translucency: 0.5
    liquid_glass_specular: true
    liquid_glass_shadow_kind: "Chromatic"
    liquid_glass_shadow_opacity: 0.5
    liquid_glass_blur: 0.5
  web:
    generate: true
    image_path: "assets/images/icon-master-1024.png"
    background_color: "#aafb2b"
    theme_color: "#aafb2b"
  windows:
    generate: true
    image_path: "assets/images/icon-master-1024.png"
  macos:
    generate: true
    image_path: "assets/images/icon-master-1024.png"
  linux:
    generate: true
    image_path: "assets/images/icon-master-1024.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon-master-1024.png
